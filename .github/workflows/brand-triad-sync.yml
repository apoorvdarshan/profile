name: brand-triad-sync
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/brand-triad-sync.yml"
permissions:
  contents: write
jobs:
  sync-from-github-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Sync profile data from live GitHub README
        run: npm run sync-profile
      - name: Commit updated profileData
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/profileData.generated.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Sync tech badges: Tailwind CSS, Cloudflare Workers, Claude Code, Cursor"
          git push
