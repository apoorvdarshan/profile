name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r scripts/automation/requirements.txt
      - run: npm run lint
      - run: node --test scripts/automation/*.test.mjs
      - run: python -m unittest discover -s scripts/automation -p 'test_*.py'
      - run: npm audit --audit-level=moderate
      - run: python -m pip install pip-audit==2.9.0 bandit==1.8.6
      - run: pip-audit -r scripts/automation/requirements.txt
      - run: bandit -r scripts/automation -x scripts/automation/test_android_downloads.py,scripts/automation/test_ios_downloads.py,scripts/automation/test_npm_downloads.py,scripts/automation/test_distribution_counts.py,scripts/automation/test_local_resume.py -ll
      - run: npm run build
